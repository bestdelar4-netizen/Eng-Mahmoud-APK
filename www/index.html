<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d81b60">
<title>👑 Eng. Mahmoud</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff5f7}.hero{min-height:70vh;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url('https://images.unsplash.com/photo-1518199266791-5375a83190b7');background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center;padding:20px;position:relative}.hero-icons{position:absolute;top:15px;left:15px;display:flex;gap:6px}.icon-btn{background:rgba(255,255,255,.9);color:#d81b60;border:none;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}.counter{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;justify-content:center}.counter div{background:rgba(255,255,255,.25);padding:12px;border-radius:10px;min-width:50px}.counter span{display:block;font-weight:bold;font-size:1.3rem}.tabs{display:flex;justify-content:center;gap:8px;padding:15px 8px;background:white;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0000000d}.tab{padding:10px 14px;border-radius:25px;border:2px solid #f8bbd0;background:white;cursor:pointer}.tab.active{background:#d81b60;color:white;border-color:#d81b60}section{padding:20px 15px;max-width:800px;margin:auto}.card{background:white;padding:15px;border-radius:15px;box-shadow:0 5px 15px #00000012;margin-bottom:15px;cursor:pointer;position:relative;overflow:hidden}.watermark{position:relative}.watermark:after{content:"👑 Eng. Mahmoud";position:absolute;bottom:8px;left:10px;background:#0009;color:white;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:bold;z-index:2}.sig-line{text-align:left;font-size:11px;color:#d81b60;margin-top:8px;font-weight:bold}.btn{padding:12px;background:#d81b60;color:white;border:none;border-radius:10px;width:100%;margin-top:10px;font-size:16px;cursor:pointer}.modal{display:none;position:fixed;inset:0;width:100%;height:100%;background:#000c;justify-content:center;align-items:center;z-index:9999;padding:15px;box-sizing:border-box}.modal-box{background:white;width:100%;max-width:500px;max-height:85vh;overflow:auto;border-radius:15px;padding:20px;position:relative;text-align:center;box-sizing:border-box}.close{position:absolute;top:10px;left:15px;font-size:26px;cursor:pointer}input,textarea,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}img.res,video.res{width:100%;border-radius:10px;margin-top:10px;max-height:400px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid img,.grid video{height:150px;object-fit:cover;border-radius:10px;width:100%}.hidden{display:none}.signature-footer{text-align:center;padding:35px 20px;margin-top:50px;border-top:2px dashed #f8bbd0;color:#d81b60}#lockScreen{position:fixed;inset:0;width:100%;height:100%;background:#fff5f7;z-index:10000;display:flex;justify-content:center;align-items:center;padding:20px;box-sizing:border-box}#musicBar{position:fixed;bottom:12px;right:12px;left:12px;margin:auto;max-width:340px;background:white;padding:8px 12px;border-radius:30px;box-shadow:0 5px 20px #0002;display:flex;align-items:center;justify-content:center;gap:10px;z-index:100}#musicBar button{flex-shrink:0}
</style>
</head>
<body>
<div id="lockScreen"><div style="background:white;padding:30px;border-radius:20px;max-width:350px;width:100%;text-align:center"><h2>👑 Eng. Mahmoud</h2><p id="lockText">حط باسورد لأول مرة</p><input type="password" id="passInput" placeholder="الباسورد"><button class="btn" onclick="checkPass()">دخول 🔓</button></div></div>
<div id="musicBar"><button onclick="toggleMusic()" id="musicBtn" style="border:none;background:#d81b60;color:white;width:36px;height:36px;border-radius:50%">▶️</button><span style="font-size:12px">👑 Eng. Mahmoud</span><button onclick="document.getElementById('musicFile').click()" style="border:none;background:#eee;border-radius:50%;width:30px;height:30px">🎵</button><input type="file" id="musicFile" accept="audio/*" style="display:none" onchange="changeMusic(event)"><audio id="bgMusic" loop></audio></div>
<div class="hero" id="hero"><div class="hero-icons"><button class="icon-btn" onclick="openEdit()">⚙️</button><button class="icon-btn" onclick="document.getElementById('heroFile').click()">🖼️</button><button class="icon-btn" onclick="changePassword()">🔒</button><input type="file" id="heroFile" accept="image/*" style="display:none" onchange="changeHeroImage(event)"></div><h1 id="heroName">👑 Eng. Mahmoud</h1><p>بدأنا يوم <span id="dateText"></span></p><div class="counter"><div><span id="d">0</span>يوم</div><div><span id="h">0</span>ساعة</div><div><span id="m">0</span>دقيقة</div><div><span id="s">0</span>ثانية</div></div></div>
<div class="tabs"><button class="tab active" id="tab-msg" onclick="showTab('msgs')">💌 الرسايل</button><button class="tab" id="tab-photo" onclick="showTab('photos')">📸 الصور</button><button class="tab" id="tab-table" onclick="showTab('table')">📅 الجدول</button></div>
<section><button class="btn" style="background:#2e7d32;max-width:300px;margin:auto;display:block" onclick="openAdd()">+ إضافة صورة / فيديو / رسالة</button><div id="view-msgs" style="margin-top:20px"></div><div id="view-photos" class="hidden"><div id="photosGrid" class="grid"></div></div><div id="view-table" class="hidden"><table style="width:100%;border-collapse:collapse;margin-top:15px"><thead><tr><th>العنوان</th><th>النوع</th></tr></thead><tbody id="tableBody"></tbody></table></div></section>
<div class="signature-footer">تم بكل حب بواسطة<br><span style="font-size:28px">👑 Eng. Mahmoud</span><br><span style="font-size:12px;color:#999">Every Memory Signed - 2026</span></div>
<div id="editModal" class="modal"><div class="modal-box"><span class="close" onclick="closeEdit()">×</span><h3>تعديل المقدمة</h3><input id="inputName" value="👑 Eng. Mahmoud"><input type="date" id="inputDate"><button class="btn" onclick="saveEdit()">حفظ</button></div></div>
<div id="addModal" class="modal"><div class="modal-box"><span class="close" onclick="closeAdd()">×</span><h3>إضافة جديدة</h3><select id="addType"><option value="رسالة">💌 رسالة</option><option value="صورة">📸 صورة</option><option value="فيديو">🎬 فيديو</option><option value="ذكرى">📅 ذكرى</option></select><input id="addTitle" placeholder="العنوان"><textarea id="addDesc" rows="3" placeholder="الرسالة"></textarea><input type="file" id="addMediaFile" accept="image/*,video/*"><input id="addMediaUrl" placeholder="أو رابط مباشر للوسائط"><button class="btn" style="background:#2e7d32" onclick="saveNewMemory()">إضافة ✨</button></div></div>
<div id="viewModal" class="modal" onclick="closeView()"><div class="modal-box" onclick="event.stopPropagation()"><span class="close" onclick="closeView()">×</span><h2 id="vTitle"></h2><p id="vDesc"></p><div class="watermark"><img id="vImg" class="res" style="display:none"><video id="vVideo" class="res" controls style="display:none"></video></div><div class="sig-line">👑 Eng. Mahmoud</div><button class="btn" style="background:#c62828" onclick="deleteCurrent()">حذف</button></div></div>
<script>
let currentViewIndex=-1,counterTimer=null,isPlaying=false;
function initLock(){let s=localStorage.getItem('sitePass');document.getElementById('lockText').innerText=s?'اكتب الباسورد للدخول':'حط باسورد لأول مرة';}
function checkPass(){let s=localStorage.getItem('sitePass'),input=document.getElementById('passInput').value;if(!s){if(!input)return alert('اكتب باسورد');localStorage.setItem('sitePass',input);document.getElementById('lockScreen').style.display='none';loadData();}else if(input===s){document.getElementById('lockScreen').style.display='none';loadData();}else alert('الباسورد غلط ❌');}
function changePassword(){let n=prompt('الباسورد الجديد:');if(n){localStorage.setItem('sitePass',n);alert('تم تغيير الباسورد');}}
function loadData(){let d=localStorage.getItem('loveDate')||'2023-01-01',h=localStorage.getItem('heroImg'),name=localStorage.getItem('heroName')||'👑 Eng. Mahmoud';if(h)document.getElementById('hero').style.backgroundImage="linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url('"+h+"')";document.getElementById('heroName').innerText=name;document.getElementById('inputName').value=name;document.getElementById('dateText').innerText=new Date(d+'T00:00:00').toLocaleDateString('ar-EG');document.getElementById('inputDate').value=d;let m=localStorage.getItem('bgMusic');if(m)document.getElementById('bgMusic').src=m;renderAll();startCounter(d);}
function startCounter(s){if(counterTimer)clearInterval(counterTimer);counterTimer=setInterval(()=>{let diff=new Date()-new Date(s+'T00:00:00');if(isNaN(diff))return;document.getElementById('d').innerText=Math.max(0,Math.floor(diff/86400000));document.getElementById('h').innerText=Math.floor((diff%86400000)/3600000);document.getElementById('m').innerText=Math.floor((diff%3600000)/60000);document.getElementById('s').innerText=Math.floor((diff%60000)/1000);},1000);}
function changeHeroImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{localStorage.setItem('heroImg',ev.target.result);document.getElementById('hero').style.backgroundImage="linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url('"+ev.target.result+"')";};r.readAsDataURL(f);}
function changeMusic(e){let f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024)return alert('حجم الأغنية كبير للتخزين المحلي؛ جرّب ملفًا أقل من 8 ميجابايت');let r=new FileReader();r.onload=ev=>{try{localStorage.setItem('bgMusic',ev.target.result);}catch(err){alert('مساحة التخزين غير كافية');return;}let a=document.getElementById('bgMusic');a.src=ev.target.result;a.play();isPlaying=true;document.getElementById('musicBtn').innerText='⏸️';};r.readAsDataURL(f);}
function toggleMusic(){let a=document.getElementById('bgMusic');if(!a.src)return alert('اختار أغنية من 🎵');if(isPlaying){a.pause();document.getElementById('musicBtn').innerText='▶️';}else{a.play().catch(()=>alert('اضغط تشغيل مرة أخرى للسماح بتشغيل الموسيقى'));document.getElementById('musicBtn').innerText='⏸️';}isPlaying=!isPlaying;}
function showTab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+(t==='msgs'?'msg':t==='photos'?'photo':'table')).classList.add('active');['msgs','photos','table'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==t));}
function getMemories(){try{return JSON.parse(localStorage.getItem('memories')||'[]')}catch(e){return []}}
function safeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderAll(){let mems=getMemories(),msgsDiv=document.getElementById('view-msgs'),grid=document.getElementById('photosGrid'),tbody=document.getElementById('tableBody');msgsDiv.innerHTML='';grid.innerHTML='';tbody.innerHTML='';if(!mems.length){msgsDiv.innerHTML='<div class="card">لسه مفيش حاجة، دوس إضافة فوق</div>';return;}mems.forEach((m,i)=>{let card=document.createElement('div');card.className='card';card.innerHTML='<span style="font-size:11px;color:#999">'+safeText(m.type)+'</span><h3>'+safeText(m.title)+'</h3><p>'+safeText((m.desc||'').substring(0,80))+'</p>'+(m.img?'<div class="watermark">'+((m.isVideo||m.type==='فيديو')?'<video src="'+safeText(m.img)+'" class="res" style="height:200px" controls></video>':'<img src="'+safeText(m.img)+'" class="res" style="height:200px">')+'</div>':'')+'<div class="sig-line">👑 Eng. Mahmoud</div>';card.onclick=()=>openView(i);msgsDiv.appendChild(card);if(m.img){let wrap=document.createElement('div');wrap.className='watermark';wrap.innerHTML=(m.isVideo||m.type==='فيديو')?'<video src="'+safeText(m.img)+'"></video>':'<img src="'+safeText(m.img)+'">';wrap.style.cursor='pointer';wrap.onclick=()=>openView(i);grid.appendChild(wrap);}let tr=document.createElement('tr');tr.innerHTML='<td>'+safeText(m.title)+'</td><td>'+safeText(m.type)+'</td>';tr.onclick=()=>openView(i);tbody.appendChild(tr);});}
function openEdit(){document.getElementById('editModal').style.display='flex'}function closeEdit(){document.getElementById('editModal').style.display='none'}function saveEdit(){let d=document.getElementById('inputDate').value,n=document.getElementById('inputName').value.trim()||'👑 Eng. Mahmoud';if(d)localStorage.setItem('loveDate',d);localStorage.setItem('heroName',n);closeEdit();loadData()}
function openAdd(){document.getElementById('addModal').style.display='flex'}function closeAdd(){document.getElementById('addModal').style.display='none'}
function saveNewMemory(){let mems=getMemories(),title=document.getElementById('addTitle').value||'بدون عنوان',desc=document.getElementById('addDesc').value||'',type=document.getElementById('addType').value,url=document.getElementById('addMediaUrl').value.trim(),file=document.getElementById('addMediaFile');const add=(img,isVideo)=>{mems.push({title,desc,img,type,isVideo});try{localStorage.setItem('memories',JSON.stringify(mems));}catch(e){alert('مساحة التخزين غير كافية. جرّب صورة أصغر أو رابطًا مباشرًا.');return;}closeAdd();renderAll();document.getElementById('addTitle').value='';document.getElementById('addDesc').value='';file.value='';document.getElementById('addMediaUrl').value='';};if(file.files&&file.files[0]){let f=file.files[0];if(f.size>5*1024*1024)return alert('الملف أكبر من 5 ميجابايت وقد يتجاوز التخزين المحلي؛ استخدم ملفًا أصغر أو رابطًا مباشرًا');let r=new FileReader();r.onload=e=>add(e.target.result,f.type.startsWith('video/')||type==='فيديو');r.readAsDataURL(f);}else add(url,/(\.mp4|\.webm|video)/i.test(url)||type==='فيديو');}
function openView(i){currentViewIndex=i;let m=getMemories()[i];if(!m)return;document.getElementById('vTitle').innerText=m.title;document.getElementById('vDesc').innerText=m.desc;let im=document.getElementById('vImg'),v=document.getElementById('vVideo');im.style.display='none';v.style.display='none';v.pause();if(m.img){if(m.isVideo||m.type==='فيديو'){v.src=m.img;v.style.display='block'}else{im.src=m.img;im.style.display='block'}}document.getElementById('viewModal').style.display='flex'}
function closeView(){document.getElementById('viewModal').style.display='none';document.getElementById('vVideo').pause()}function deleteCurrent(){if(!confirm('متأكد إنك عايز تحذف الذكرى؟'))return;let mems=getMemories();mems.splice(currentViewIndex,1);localStorage.setItem('memories',JSON.stringify(mems));closeView();renderAll()}
initLock();document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPass()});
</script>
</body>
</html>
